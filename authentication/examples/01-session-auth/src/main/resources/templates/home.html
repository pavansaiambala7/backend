<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>Your account</h1>
    <p>Signed in as <strong id="username" th:text="${username}">user@example.com</strong>.</p>

    <!-- Logout is a POST with a CSRF token: a GET logout could be triggered by any <img> on another site. -->
    <form method="post" th:action="@{/logout}">
        <button type="submit">Sign out</button>
    </form>
</main>
</body>
</html>
